spring:
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER:root}
    password: ${POSTGRES_PASSWORD:root}

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update

public:
  key: classpath:public.example-key
private:
  key: classpath:private.example-key

api:
  frontend:
    url: ${FRONTEND_URL}

adm1:
  email: ${ADM_1_EMAIL}
  password: ${ADM_1_PASSWORD}